# One access log file per day, so that old days can be deleted (see the
# goaccess service in docker-compose.yml).
map $time_iso8601 $access_log_date {
    "~^(?<date>\d{4}-\d{2}-\d{2})" $date;
    default unknown;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the reverse proxy, take the visitor's address from
    # X-Forwarded-For, but only when the request comes from a private network
    # (the proxy), so that it cannot be spoofed from outside.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log combined;
    access_log /var/log/mapartcraft/access-$access_log_date.log combined;

    # Keep redirects relative so they survive port mappings and proxies.
    absolute_redirect off;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # The app lives in /mapartcraft/; send visitors there.
    location = / {
        return 302 /mapartcraft/;
    }

    location = /mapartcraft {
        return 301 /mapartcraft/;
    }

    # Web workers are imported as .jsworker files; browsers only run them
    # when served as JavaScript.
    location ~ \.jsworker$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Visitor statistics generated by GoAccess, behind a password.
    location /stats/ {
        alias /var/www/stats/;
        index index.html;
        auth_basic "MapartCraft statistics";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        add_header Cache-Control "no-cache";
        access_log /var/log/nginx/access.log combined;
    }

    location = /stats {
        return 301 /stats/;
    }

    # Hashed build assets never change under the same name.
    location /mapartcraft/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes fall back to the app; keep index.html fresh so a
    # redeploy takes effect immediately.
    location /mapartcraft/ {
        try_files $uri $uri/ /mapartcraft/index.html;
        add_header Cache-Control "no-cache";
    }
}
